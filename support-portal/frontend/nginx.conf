server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html index.htm;

  location / {
    try_files $uri /index.html;
  }

  # Simple health endpoint used by monitoring
  location = /health {
    add_header Content-Type application/json;
    return 200 '{"status":"UP"}';
  }

  # Proxy API requests to backend; in production configure gateway / env instead
  location /api/ {
    proxy_pass http://auth-service:4000/api/; # default inside compose network; overridden via env in production
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
