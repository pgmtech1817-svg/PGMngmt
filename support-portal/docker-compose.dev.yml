version: '3.8'
services:
  auth-db:
    image: mysql:8.0
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${AUTH_DB_NAME:-auth_db}
    volumes:
      - ./database/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "33061:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  pg-db:
    image: mysql:8.0
    env_file:
      - ./.env
    environment:
      MYSQL_ROOT_PASSWORD: ${PG_DB_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${PG_DB_NAME:-pg_db}
    volumes:
      - ./database/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "33062:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./backend-services/auth-service
    env_file:
      - ./.env
    environment:
      SPRING_DATASOURCE_URL: ${AUTH_DB_URL:-jdbc:mysql://auth-db:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
      SPRING_DATASOURCE_USERNAME: ${AUTH_DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-rootpw}
      JWT_SECRET: ${AUTH_JWT_SECRET:-change_this_local_secret}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    ports:
      - "4000:4000"
    depends_on:
      auth-db:
        condition: service_healthy

  pg-service:
    build:
      context: ./backend-services/pg-service
    env_file:
      - ./.env
    environment:
      SPRING_DATASOURCE_URL: ${PG_DB_URL:-jdbc:mysql://pg-db:3306/pg_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
      SPRING_DATASOURCE_USERNAME: ${PG_DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${PG_DB_PASSWORD:-rootpw}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
    ports:
      - "4001:4001"
    depends_on:
      pg-db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      REACT_APP_AUTH_URL: http://localhost:4000/api
      REACT_APP_PG_URL: http://localhost:4001/api
    ports:
      - "3000:80"
    depends_on:
      - auth-service
      - pg-service

  occupant-service:
    build:
      context: ./backend-services/occupant-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "4002:4002"
    depends_on:
      - auth-service

  payment-service:
    build:
      context: ./backend-services/payment-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "4003:4003"
    depends_on:
      - auth-service

  notification-service:
    build:
      context: ./backend-services/notification-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "4004:4004"
    depends_on:
      - auth-service

  scheduler-service:
    build:
      context: ./backend-services/scheduler-service
    environment:
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "4005:4005"
    depends_on:
      - auth-service

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      - auth-service
      - pg-service
      - occupant-service
      - payment-service
      - notification-service
      - scheduler-service

  grafana:
    image: grafana/grafana:9.0
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana-data:

networks:
  default:
    name: support-portal-dev
