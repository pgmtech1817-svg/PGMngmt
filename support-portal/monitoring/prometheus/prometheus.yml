global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring-services'
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['auth-service:4000', 'pg-service:4001', 'occupant-service:4002', 'payment-service:4003', 'notification-service:4004', 'scheduler-service:4005']

  - job_name: 'frontend-health'
    metrics_path: /health
    static_configs:
      - targets: ['frontend:80']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
