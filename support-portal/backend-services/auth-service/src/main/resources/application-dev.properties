spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://auth-db:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rootpw}

spring.jpa.hibernate.ddl-auto=update
app.jwtSecret=${JWT_SECRET:change_this_local_secret}
app.jwtExpirationMs=28800000
server.port=4000

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
