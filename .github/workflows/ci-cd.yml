name: CI/CD Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select deployment environment'
        required: true
        type: choice
        options:
          - dev
          - uat
          - sit
          - nft
          - preprod
          - prod

env:
  DOCKER_REGISTRY: docker.io

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, pg-service, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: matrix.service != 'frontend'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node
        if: matrix.service == 'frontend'
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Maven package (Java services)
        if: matrix.service != 'frontend'
        working-directory: ./support-portal/backend-services/${{ matrix.service }}
        run: mvn -B package --file pom.xml -DskipTests

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN }}
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        if: ${{ secrets.DOCKERHUB_USERNAME && secrets.DOCKERHUB_TOKEN }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service == 'frontend' && './support-portal/frontend' || format('./support-portal/backend-services/{0}', matrix.service) }}
          file: ${{ matrix.service == 'frontend' && './support-portal/frontend/Dockerfile' || format('./support-portal/backend-services/{0}/Dockerfile', matrix.service) }}
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.ref_name }}
            ${{ env.DOCKER_REGISTRY }}/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}

      - name: Skipping Docker push (no secrets)
        if: ${{ !secrets.DOCKERHUB_USERNAME || !secrets.DOCKERHUB_TOKEN }}
        run: echo "DOCKERHUB_USERNAME / DOCKERHUB_TOKEN not set — skipping Docker login and image push. Builds completed."
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to selected environment
        env:
          TARGET_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'dev' }}
        run: |
          echo "Workflow triggered by: ${{ github.event_name }}"
          echo "Build tag: ${{ github.sha }}"
          echo "Deployment target: $TARGET_ENVIRONMENT"
          echo "This workflow can be used for dev, uat, sit, nft, preprod, or prod."

      - name: Environment note
        run: |
          echo "If you want approval gates, configure GitHub Environments in Settings > Environments and add required reviewers to prod and preprod."
